name: Radar

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora, no minuto 7 (UTC). GitHub pode atrasar alguns minutos.
  workflow_dispatch: {}    # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]
    paths: ["config/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar edição
        run: node scripts/gerar.mjs
      - name: Publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "Sem mudanças" && exit 0
          git commit -m "Radar: edição $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git push
